name: Mantener despierta la app
# Cada 10 min de 18:00 a 09:00 (hora de Madrid, invierno = UTC+1)
on:
  schedule:
    - cron: '*/10 17-23,0-7 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://despertares-miguel-jr.onrender.com/healthz
