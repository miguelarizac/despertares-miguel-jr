name: Mantener despierta la app
# Despierta de 23:30 a 08:00 hora de Madrid (invierno = UTC+1).
# Primer aviso 23:20 para que ya esté caliente a las 23:30; último 07:50.
on:
  schedule:
    - cron: '20-59/10 22 * * *'
    - cron: '*/10 23,0-6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://despertares-miguel-jr.onrender.com/healthz
